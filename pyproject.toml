[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-one"
version = "0.1.0"
description = "3D lesion detection for automated breast ultrasound (ABUS)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "numpy",
    "scipy",
    "pandas",
    "pynrrd",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
